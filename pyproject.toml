[project]
name = "pgmlens-workspace"
version = "0.0.0"
description = "Workspace root for the PGM Lens monorepo (not published)."
requires-python = ">=3.12"
dependencies = [
    "pgmlens-core",
    "pgmlens-connectors",
    "pgmlens-reporting",
    "pgmlens-api",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/api"]

[tool.uv.sources]
pgmlens-core = { workspace = true }
pgmlens-connectors = { workspace = true }
pgmlens-reporting = { workspace = true }
pgmlens-api = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "httpx>=0.27",
    "pre-commit>=3.8",
]

[tool.pytest.ini_options]
testpaths = ["packages", "apps/api"]
pythonpath = ["packages/core/tests", "packages/connectors/tests", "packages/reporting/tests", "apps/api/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
filterwarnings = ["error::DeprecationWarning:pgmlens_*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/web", "docs/site"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF012", "E501"]  # the formatter owns line length; long prose strings are fine

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["B011"]
