[project]
name = "pgmlens-reporting"
version = "0.1.0"
description = "PGM Lens reporting: executive briefings where every claim is tied to evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "PGM Lens contributors" }]
dependencies = [
    "pgmlens-core",
]

[project.optional-dependencies]
# Any provider LiteLLM supports, including local models through Ollama.
llm = ["litellm>=1.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgmlens_reporting"]
