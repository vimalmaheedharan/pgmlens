[project]
name = "pgmlens-core"
version = "0.1.0"
description = "PGM Lens core: normalized program model plus pure graph, risk and forecast engines (no I/O)."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "PGM Lens contributors" }]
keywords = ["program-management", "risk", "forecasting", "dependency-graph", "monte-carlo"]
dependencies = [
    "pydantic>=2.8",
    "networkx>=3.3",
    "numpy>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
pgmlens = "pgmlens_core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgmlens_core"]
