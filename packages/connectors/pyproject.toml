[project]
name = "pgmlens-connectors"
version = "0.1.0"
description = "PGM Lens connectors: pull Jira, GitLab and GitHub data into the normalized program model."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "PGM Lens contributors" }]
dependencies = [
    "pgmlens-core",
    "httpx>=0.27",
]

# Third-party packages can register their own connectors under the same group.
[project.entry-points."pgmlens.connectors"]
jira = "pgmlens_connectors.jira:JiraConnector"
gitlab = "pgmlens_connectors.gitlab:GitLabConnector"
github = "pgmlens_connectors.github:GitHubConnector"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pgmlens_connectors"]
